name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Until the gate version the Dockerfile pins is on npm, build it from the
      # gate repository so the image still gets the Hermes hook.
      - name: Pick the approval gate
        id: gate
        run: |
          want=$(sed -n 's/^ARG GATE_SPEC=//p' Dockerfile)
          if npm view "$want" version >/dev/null 2>&1; then
            echo "spec=$want" >> "$GITHUB_OUTPUT"
          else
            # main until the Hermes hook lands there, then the gate's open PR branch.
            for ref in ${GATE_REF} main claude/project-thread-uaqm61; do
              rm -rf /tmp/gate
              git clone -q --depth 1 --branch "$ref" https://github.com/hibira-io/mcp-approval-gate /tmp/gate || continue
              grep -q "hermes" /tmp/gate/src/hook.js 2>/dev/null && { echo "gate from $ref"; break; }
            done
            grep -q "hermes" /tmp/gate/src/hook.js
            (cd /tmp/gate && npm pack --pack-destination "$GITHUB_WORKSPACE/build")
            echo "spec=/tmp/hibira-build/$(ls build | grep '\.tgz$' | head -1)" >> "$GITHUB_OUTPUT"
          fi
        env:
          GATE_REF: ${{ vars.GATE_REF }}

      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: hermes-ops-agent:ci
          build-args: GATE_SPEC=${{ steps.gate.outputs.spec }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: tests/smoke.sh hermes-ops-agent:ci

      - name: Setup script syntax
        run: python3 -m py_compile rootfs/opt/hibira/bin/hibira-setup
